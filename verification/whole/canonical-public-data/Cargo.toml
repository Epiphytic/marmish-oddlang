[package]
name = "public-data-qualification"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
toml = "0.8.23"

[[bin]]
name = "compose-public-data"
path = "compose_cli.rs"

[[bin]]
name = "qualify-mdk-data"
path = "../mdk-public-data/verify.rs"

[[bin]]
name = "mdk-member-witness"
path = "../mdk-public-data/member_cli.rs"

[[bin]]
name = "compose-six-member"
path = "../unified-mdk/compose_cli.rs"

[[bin]]
name = "workspace-product"
path = "witness.rs"

[[bin]]
name = "qualify-canonical-public-data"
path = "qualify.rs"

[[bin]]
name = "qualify-six-member"
path = "../unified-mdk/qualify.rs"

[[bin]]
name = "compose-buffered"
path = "../unified-buffered/compose_cli.rs"

[[bin]]
name = "qualify-range-data"
path = "../canonical-range-data/verify.rs"

[[bin]]
name = "qualify-recovered-range"
path = "../canonical-recovered-range/verify.rs"
